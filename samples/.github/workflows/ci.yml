# Generic Thecore host-app GitHub Actions CI pipeline. Uses the same devcontainer
# image every Thecore app already runs in locally, so the pipeline environment
# matches development exactly. Sibling of samples/.gitlab-ci.yml — see ADR 0007
# in docs/adr/ for why both exist unconditionally (git hosting is a generic,
# per-developer choice, not something to prompt about). Security scanning
# (brakeman, bundler-audit, nightly too) lives in security.yml next to this
# file, so the nightly schedule never builds, tests or deploys.
name: CI

on:
  # Only fires on branch pushes that touch the "version" file -- a pipeline run
  # is meant to be a deliberate version bump, not every commit. Tag pushes never
  # match "branches", so this naturally excludes tag pipelines too, mirroring
  # the GitLab sample's `$CI_COMMIT_TAG == null` guard with no extra condition.
  push:
    branches: ["**"]
    paths:
      - version
  # Lets a maintainer trigger the production deploy manually from the Actions UI.
  # GitHub has no zero-config equivalent to GitLab's `when: manual` (the real
  # equivalent, Environments + required reviewers, needs one-time per-repo setup
  # only a human can do) -- workflow_dispatch keeps this sample fully self-
  # contained instead, at the cost of losing the "gated by a fresh green build"
  # guarantee GitLab's `when: manual` job gets for free.
  workflow_dispatch:

env:
  DISABLE_SPRING: 1 # Disables the Spring preloader for a clean CI environment.

jobs:
  # The container and the cache step are YAML anchors defined here, at their first
  # use, and reused below as aliases (GitHub Actions rejects unknown top-level keys,
  # so they can't live in a separate `x-...` block as in docker-compose).
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: &devcontainer
      image: gabrieletassoni/vscode-devcontainers-thecore:3
    steps:
      - uses: actions/checkout@v4
      - &cache_step
        uses: actions/cache@v4
        with:
          path: |
            vendor/bundle
            app/assets
            lib/assets
            public/assets
          key: thecore-app-cache-${{ hashFiles('Gemfile.lock') }}
      - run: sudo -E /usr/bin/app-compile.sh

  # Tests run against a throwaway Postgres service, the same image as the
  # devcontainer's `db`, reachable from the job container by its service name.
  # DATABASE_URL names only the server, so the database is config/database.yml's
  # test one, `<app>_test` -- the same name the app's test/test_helper.rb forces
  # whenever DATABASE_URL is set. `rails test` doesn't create a missing database,
  # so db:test:prepare creates it and loads the schema.
  test:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    container: *devcontainer
    services:
      db:
        image: postgres:15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@db:5432
    steps:
      - uses: actions/checkout@v4
      - *cache_step
      - run: bundle exec rails db:test:prepare
      - run: bundle exec rails test

  lint:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    container: *devcontainer
    steps:
      - uses: actions/checkout@v4
      - *cache_step
      - run: bundle exec rubocop

  # Deploys via the devcontainer image's own generic deploy script
  # (/usr/bin/docker-deploy.sh), which reads its targets from vendor/deploytargets/,
  # committed in this repository: one folder per provider, with its docker_host
  # (production) or docker_<TARGETENV>_host file and one <customer>.env per
  # installation (no secrets: SECRET_KEY_BASE lives on the Docker host, see
  # CLAUDE.md). A provider without the host file for this environment is skipped;
  # with no vendor/deploytargets/ committed at all, the job fails.
  # No customer-specific paths here.
  to-dev:
    if: github.event_name == 'push'
    needs: [test, lint]
    runs-on: ubuntu-latest
    container: *devcontainer
    env:
      TARGETENV: dev
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/docker-deploy.sh

  # Manual-only, decoupled from the push-triggered jobs above (workflow_dispatch
  # is a distinct trigger event -- see the comment on that trigger for why).
  to-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: *devcontainer
    continue-on-error: true # Mirrors the GitLab sample's `allow_failure: true`.
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/docker-deploy.sh
