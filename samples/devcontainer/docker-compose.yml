services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/app:cached
      - tmp:/workspaces/app/tmp
      - bundle:/workspaces/app/vendor/bundle
      - /var/run/docker.sock:/var/run/docker.sock

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://postgres:postgres@db:5432/app_dev?pool=5
      RAILS_ENV: development
      SECRET_KEY_BASE: dummy

    # Run all container processes as the non-root dev user. Without this the
    # container's default user is root (the Dockerfile ends on `USER root`),
    # so anything that isn't `postCreateCommand` (which devcontainer.json's
    # remoteUser runs as vscode) — devcontainer feature installs, the
    # `sleep infinity` command, a plain `docker compose exec` — creates
    # root-owned files. That mixed ownership breaks `bundle update`/`bundle
    # install`: /usr/local/bundle/bin has the sticky bit set, so vscode can't
    # overwrite or delete binstubs it doesn't own.
    user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:7-bookworm
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    # Pin both the Postgres major version AND the base OS (bookworm) — Postgres
    # doesn't provide its own collations, it uses the base OS's, so a bare
    # `postgres:15` tag silently moving to a newer Debian release (as it did
    # from bullseye to bookworm) is a breaking change, not just a patch bump.
    image: postgres:15-bookworm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-db-user.sql:/docker-entrypoint-initdb.d/create-db-user.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:
  tmp:
  bundle:
