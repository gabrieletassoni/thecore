services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    volumes:
      - ..:/workspaces/app:cached
      - tmp:/workspaces/app/tmp
      - bundle:/workspaces/app/vendor/bundle
      - /var/run/docker.sock:/var/run/docker.sock

    # The socket keeps the host's gid; docker-socket-gid.sh (initializeCommand)
    # writes it to .devcontainer/.env. 996 is the dev image's own docker group.
    group_add:
      - "${DOCKER_SOCKET_GID:-996}"

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      REDIS_URL: redis://redis:6379/1
      DATABASE_URL: postgres://postgres:postgres@db:5432/app_dev?pool=5
      RAILS_ENV: development
      SECRET_KEY_BASE: dummy
      # System tests (bin/rails test:system) drive this remote browser (ADR 0010).
      SELENIUM_URL: http://selenium:4444

    # Run all container processes as the non-root dev user. Without this the
    # container's default user is root (the Dockerfile ends on `USER root`),
    # so anything that isn't `postCreateCommand` (which devcontainer.json's
    # remoteUser runs as vscode) — devcontainer feature installs, the
    # `sleep infinity` command, a plain `docker compose exec` — creates
    # root-owned files. That mixed ownership breaks `bundle update`/`bundle
    # install`: /usr/local/bundle/bin has the sticky bit set, so vscode can't
    # overwrite or delete binstubs it doesn't own.
    user: vscode

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  redis:
    image: redis:7-bookworm
    command: redis-server
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  db:
    # Pin both the Postgres major version AND the base OS (bookworm) — Postgres
    # doesn't provide its own collations, it uses the base OS's, so a bare
    # `postgres:15` tag silently moving to a newer Debian release (as it did
    # from bullseye to bookworm) is a breaking change, not just a patch bump.
    image: postgres:15-bookworm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-db-user.sql:/docker-entrypoint-initdb.d/create-db-user.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  # Browser for the system tests, which run on demand only (ADR 0010). The app under test
  # listens on 0.0.0.0 and the browser reaches it by the app container's hostname.
  selenium:
    # Keep it on the selenium-webdriver release in Gemfile.lock.
    image: selenium/standalone-chromium:4.54.0
    shm_size: 2gb

  # Test LDAP server for the LdapServer system tests: dc=example,dc=com, admin
  # cn=admin,dc=example,dc=com / admin, plus the users in ldap-users.ldif (loaded at the first start;
  # --copy-service because the mounted file is read-only). Test-only credentials.
  ldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ./ldap-users.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-users.ldif:ro

volumes:
  postgres-data:
  tmp:
  bundle:
